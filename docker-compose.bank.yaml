services:
  bank-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${BANK_DB}
    ports:
      - "5433:5432"
    volumes:
      - bankdata:/var/lib/postgresql/data
      - ./backend/dummy_sources.sql:/docker-entrypoint-initdb.d/dummy_sources.sql:ro

volumes:
  bankdata:
