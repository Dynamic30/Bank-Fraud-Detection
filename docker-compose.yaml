services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # initdb runs these in name order: schema first, then reference rows
      - ./backend/database_structure.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/banks_seed.sql:/docker-entrypoint-initdb.d/02_banks.sql:ro
      - ./backend/app_users_seed.sql:/docker-entrypoint-initdb.d/03_users.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
